name: Build
# To test with act: gh act --secret-file $ENV_FILE --workflows .github/workflows/unit.yml
on:
  push:
    branches:
      - main
  pull_request:

env:
  EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }}
  # OpenSarToolkit resolves SNAP's gpt at import time and falls back to input()
  # when it cannot find it, which a non-interactive kernel cannot answer.
  GPT_PATH: /nonexistent/snap/bin/gpt

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create SEPAL's /ram scratch mount point
        # component.parameter.directory creates /ram/process_tmp at import time;
        # on SEPAL that path is a tmpfs, on a runner it has to be made writable.
        run: sudo mkdir -p /ram && sudo chown "$USER" /ram
      - name: Set up Python "3.10"
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install sepal_ui
        run: python -m pip install "sepal-ui>=2.22.2,<3"
      - name: Build with sepal_ui venv
        run: module_venv
      - name: Install nox
        run: python -m pip install nox
      - name: set entry point and run tests
        run: nox -s test_ui
